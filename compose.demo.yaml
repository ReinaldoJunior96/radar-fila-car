# Demonstração pública: só o proxy TLS fica exposto. O banco guarda apenas o cache do SICAR.
name: inovacar-demo

services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_DB: car
      POSTGRES_USER: carapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.demo}
    volumes:
      - car_demo_pgdata:/var/lib/postgresql/data
    shm_size: 512mb
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1500MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carapp -d car"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://carapp:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.demo}@db:5432/car
      DB_POOL_MAX_SIZE: "5"
      DB_STATEMENT_TIMEOUT_MS: "10000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  sync:
    build:
      context: ./api
    command: ["python", "-m", "app.sync_indice", "--loop"]
    environment:
      DATABASE_URL: postgresql://carapp:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.demo}@db:5432/car
      SYNC_UFS: ${SYNC_UFS:-MA}
      SYNC_INTERVALO_SEGUNDOS: ${SYNC_INTERVALO_SEGUNDOS:-10}
      SYNC_ORCAMENTO_DIARIO: ${SYNC_ORCAMENTO_DIARIO:-600}
      SYNC_JANELA_INICIO: ${SYNC_JANELA_INICIO:-20}
      SYNC_JANELA_FIM_MINUTOS: ${SYNC_JANELA_FIM_MINUTOS:-30}
      SYNC_LIMITE_ALTERACOES: ${SYNC_LIMITE_ALTERACOES:-5000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      API_RATE_LIMIT: ${API_RATE_LIMIT:-20r/s}
      API_RATE_BURST: ${API_RATE_BURST:-40}
      BATCH_RATE_LIMIT: ${BATCH_RATE_LIMIT:-2r/s}
      BATCH_RATE_BURST: ${BATCH_RATE_BURST:-5}
      EMBED_ORIGINS: ${EMBED_ORIGINS:-'self'}
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      DEMO_SITE: ${DEMO_SITE:?defina DEMO_SITE no .env.demo}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${DEMO_HTTP_PORT:-80}:80"
      - "${DEMO_HTTPS_PORT:-443}:443"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  car_demo_pgdata:
  caddy_data:
  caddy_config:
